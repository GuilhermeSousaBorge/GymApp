server:
  port: 8080

spring:
  application:
    name: minha-api-dev

  # ===============================
  # DATASOURCE - H2 (DEV)
  # ===============================
  datasource:
    url: jdbc:h2:file:./data/gymDB;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: sa

  # ===============================
  # JPA / HIBERNATE
  # ===============================
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: validate # Flyway manda, Hibernate obedece
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # ===============================
  # H2 CONSOLE
  # ===============================
#  h2:
#    console:
#      enabled: true
#      path: /h2-console

  # ===============================
  # FLYWAY
  # ===============================
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # ===============================
  # SECURITY (DEV MODE)
  # ===============================
  #  security:
  #    user:
  #      name: admin
  #      password: "{noop}admin"
  #      roles: ADMIN

  # ===============================
  # GRAPHQL
  # ===============================
  graphql:
    graphiql:
      enabled: true
      path: /graphiql
    schema:
      printer:
        enabled: true

# ===============================
# JWT (JJWT)
# ===============================
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION} # 10m em ms

# ===============================
# LOGGING
# ===============================
logging:
  level:
    root: INFO
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.springframework.security: DEBUG
