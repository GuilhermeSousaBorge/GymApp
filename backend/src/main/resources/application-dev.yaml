server:
  port: 8080

spring:
  application:
    name: minha-api-dev

  # ===============================
  # DATASOURCE - H2 (DEV)
  # ===============================
  datasource:
    url: jdbc:postgresql://localhost:5433/gym_dev
    username: postgres
    password: postgres

  # ===============================
  # JPA / HIBERNATE
  # ===============================
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate # Flyway manda, Hibernate obedece
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # ===============================
  # H2 CONSOLE
  # ===============================
  h2:
    console:
      enabled: true
      path: /h2-console

  # ===============================
  # FLYWAY
  # ===============================
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS}
            required: ${MAIL_SMTP_STARTTLS_REQUIRED}

# ===============================
# JWT (JJWT)
# ===============================
jwt:
  secret: "mYs3cr3tK3y$uP3rS3cur3W1thAtL3ast256B1tsF0rHS256Alg0r1thm!"
  expiration: 86400000 # 24h em ms
  refresh-expiration: 604800000 # 7 dias em ms

auth:
  email-verification-expiration: 900000 # 15 min
  password-reset-expiration: 900000 # 15 min

app:
  frontend:
    url: http://localhost:3000

cookie:
  secure: false
  same-site: Lax
# ===============================
# LOGGING
# ===============================
logging:
  level:
    root: INFO
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.springframework.security: DEBUG