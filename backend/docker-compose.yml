services:
  postgres:
    image: postgres:16
    container_name: gym
    environment:
      POSTGRES_DB: gym_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - gymdata:/var/lib/postgresql/data
  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped

volumes:
  gymdata: